[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palanit-core"
version = "0.1.0"
description = "A watchtower for AI agents — scan MCP servers and agent tool manifests for hidden risk."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Stanislav Miziyev", email = "stas.m@palanit.com" }]
keywords = ["security", "mcp", "ai-agents", "prompt-injection", "scanner", "llm", "supply-chain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://palanit.com"
Documentation = "https://palanit.com/docs"
Repository = "https://github.com/stasxr/palanit-core"
Issues = "https://github.com/stasxr/palanit-core/issues"

[project.scripts]
palanit = "palanit_core.cli:main"

[tool.setuptools]
packages = ["palanit_core"]

[tool.setuptools.package-data]
palanit_core = ["samples/*.json"]
