name: "Palanit Core"
author: "Stanislav Miziyev"
description: "Scan MCP servers and AI-agent tool manifests for poisoned descriptions, data exfiltration, secrets and supply-chain risk."
branding:
  icon: "shield"
  color: "blue"

inputs:
  files:
    description: "Files or globs to scan, space-separated. Example: 'mcp.config.json configs/*.json'"
    required: true
  fail-on:
    description: "Fail the build on any finding at this severity or above (INFO|LOW|MEDIUM|HIGH|CRITICAL)."
    required: false
    default: "HIGH"
  version:
    description: "palanit-core version to install (default: latest on PyPI)."
    required: false
    default: ""
  json:
    description: "Set to 'true' to also emit machine-readable JSON to the log."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Palanit Core
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          python -m pip install --quiet "palanit-core==${{ inputs.version }}"
        else
          python -m pip install --quiet palanit-core
        fi
    - name: Scan
      shell: bash
      run: |
        set -e
        if [ "${{ inputs.json }}" = "true" ]; then
          palanit scan ${{ inputs.files }} --json || true
        fi
        palanit scan ${{ inputs.files }} --fail-on "${{ inputs.fail-on }}" --no-color
